<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ship Sailing Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      color: #7dd3fc;
    }
    #gameCanvas {
      background: linear-gradient(#0c4a6e, #0369a1);
      border: 3px solid #38bdf8;
      border-radius: 12px;
      max-width: 100%;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    #ui {
      margin-top: 15px;
      text-align: center;
      font-size: 20px;
    }
    #message {
      margin-top: 10px;
      font-size: 22px;
      color: #f87171;
      min-height: 30px;
    }
    button {
      margin-top: 15px;
      padding: 12px 28px;
      font-size: 18px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #38bdf8;
    }
    .controls {
      margin-top: 12px;
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>Ship Sailing</h1>
  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div id="message"></div>
    <button id="startBtn" onclick="startGame()">Start Sailing</button>
    <div class="controls">
      Desktop: ← → or A D<br>
      Mobile: Tap left or right side of the screen
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");
    const messageDisplay = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");

    // Game variables
    let ship = { x: 175, y: 480, width: 50, height: 70 };
    let obstacles = [];
    let score = 0;
    let gameRunning = false;
    let keys = {};
    let animationId;
    let speed = 3;
    let spawnTimer = 0;

    // Controls
    window.addEventListener("keydown", e => {
      keys[e.key] = true;
    });
    window.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    // Touch controls
    canvas.addEventListener("touchstart", e => {
      e.preventDefault();
      const touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
      if (touchX < canvas.width / 2) {
        keys["ArrowLeft"] = true;
        keys["ArrowRight"] = false;
      } else {
        keys["ArrowRight"] = true;
        keys["ArrowLeft"] = false;
      }
    });
    canvas.addEventListener("touchend", () => {
      keys["ArrowLeft"] = false;
      keys["ArrowRight"] = false;
    });

    function startGame() {
      ship.x = 175;
      obstacles = [];
      score = 0;
      speed = 3;
      spawnTimer = 0;
      gameRunning = true;
      messageDisplay.textContent = "";
      startBtn.style.display = "none";
      scoreDisplay.textContent = "0";
      gameLoop();
    }

    function spawnObstacle() {
      const width = 40 + Math.random() * 30;
      const x = Math.random() * (canvas.width - width);
      obstacles.push({
        x: x,
        y: -60,
        width: width,
        height: 40 + Math.random() * 20
      });
    }

    function update() {
      if (!gameRunning) return;

      // Move ship
      if ((keys["ArrowLeft"] || keys["a"] || keys["A"]) && ship.x > 0) {
        ship.x -= 6;
      }
      if ((keys["ArrowRight"] || keys["d"] || keys["D"]) && ship.x < canvas.width - ship.width) {
        ship.x += 6;
      }

      // Spawn obstacles
      spawnTimer++;
      if (spawnTimer > 50 - Math.min(score / 10, 25)) {
        spawnObstacle();
        spawnTimer = 0;
      }

      // Move obstacles
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].y += speed;

        // Collision detection
        if (
          ship.x < obstacles[i].x + obstacles[i].width &&
          ship.x + ship.width > obstacles[i].x &&
          ship.y < obstacles[i].y + obstacles[i].height &&
          ship.y + ship.height > obstacles[i].y
        ) {
          crash();
          return;
        }

        // Remove off-screen obstacles + add score
        if (obstacles[i].y > canvas.height) {
          obstacles.splice(i, 1);
          score += 10;
          scoreDisplay.textContent = score;
          // Increase difficulty
          if (score % 50 === 0) speed += 0.3;
        }
      }
    }

    function draw() {
      // Clear
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Water waves (simple)
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(0, (Date.now() / 30 + i * 80) % 700, canvas.width, 15);
      }

      // Draw ship
      ctx.fillStyle = "#f8fafc";
      // Hull
      ctx.beginPath();
      ctx.moveTo(ship.x + 5, ship.y + 60);
      ctx.lineTo(ship.x + ship.width - 5, ship.y + 60);
      ctx.lineTo(ship.x + ship.width - 15, ship.y + 20);
      ctx.lineTo(ship.x + 15, ship.y + 20);
      ctx.closePath();
      ctx.fill();

      // Cabin
      ctx.fillStyle = "#e2e8f0";
      ctx.fillRect(ship.x + 15, ship.y + 25, 20, 20);

      // Mast
      ctx.fillStyle = "#334155";
      ctx.fillRect(ship.x + 23, ship.y, 4, 30);

      // Sail
      ctx.fillStyle = "#fef3c7";
      ctx.beginPath();
      ctx.moveTo(ship.x + 27, ship.y + 5);
      ctx.lineTo(ship.x + 55, ship.y + 20);
      ctx.lineTo(ship.x + 27, ship.y + 35);
      ctx.closePath();
      ctx.fill();

      // Draw obstacles (rocks)
      obstacles.forEach(obs => {
        ctx.fillStyle = "#57534e";
        ctx.beginPath();
        ctx.moveTo(obs.x + obs.width / 2, obs.y);
        ctx.lineTo(obs.x + obs.width, obs.y + obs.height * 0.7);
        ctx.lineTo(obs.x + obs.width * 0.8, obs.y + obs.height);
        ctx.lineTo(obs.x + obs.width * 0.2, obs.y + obs.height);
        ctx.lineTo(obs.x, obs.y + obs.height * 0.7);
        ctx.closePath();
        ctx.fill();

        // Rock highlight
        ctx.fillStyle = "#78716c";
        ctx.beginPath();
        ctx.arc(obs.x + obs.width * 0.3, obs.y + obs.height * 0.4, 6, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function crash() {
      gameRunning = false;
      messageDisplay.textContent = "CRASH! Your ship sank!";
      startBtn.style.display = "inline-block";
      startBtn.textContent = "Sail Again";
      cancelAnimationFrame(animationId);
    }

    function gameLoop() {
      update();
      draw();
      if (gameRunning) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    // Initial draw
    draw();
  </script>
</body>
</html>
